services:
  postgres:
    image: postgres:16-alpine
    container_name: followa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-followa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-followa}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U followa -d followa"], interval: 5s, timeout: 5s, retries: 10 }
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: "no"
    command: ["node", "apps/api/node_modules/prisma/build/index.js", "migrate", "deploy", "--schema", "apps/api/prisma/schema.prisma"]
    environment: { DATABASE_URL: postgresql://${POSTGRES_USER:-followa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-followa}?schema=public }
    depends_on: { postgres: { condition: service_healthy } }
  seed:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: "no"
    command: ["node", "apps/api/node_modules/tsx/dist/cli.mjs", "apps/api/prisma/seed.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-followa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-followa}?schema=public
      SYSTEM_ADMIN_USERNAME: ${SYSTEM_ADMIN_USERNAME:-admin}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:?set in .env}
    depends_on: { migrate: { condition: service_completed_successfully } }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    container_name: followa-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-followa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-followa}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      MESSAGING_CREDENTIALS_KEY: ${MESSAGING_CREDENTIALS_KEY:?set in .env}
      OTP_PROVIDER: ${OTP_PROVIDER:-mock}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      NOTIFICATION_WORKER_POLL_MS: ${NOTIFICATION_WORKER_POLL_MS:-2000}
      NOTIFICATION_WORKER_LEASE_MS: ${NOTIFICATION_WORKER_LEASE_MS:-30000}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      BALE_LINKING_ENABLED: ${BALE_LINKING_ENABLED:-false}
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
      BALE_BOT_USERNAME: ${BALE_BOT_USERNAME:-}
      BALE_WEBHOOK_SECRET: ${BALE_WEBHOOK_SECRET:-}
      STORAGE_DIR: /data/files
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
    volumes: [files:/data/files]
    depends_on: { migrate: { condition: service_completed_successfully } }
  notification-worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    container_name: followa-notification-worker
    restart: unless-stopped
    command: ["node", "apps/api/dist/modules/messaging/delivery-worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-followa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-followa}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      MESSAGING_CREDENTIALS_KEY: ${MESSAGING_CREDENTIALS_KEY:?set in .env}
      NOTIFICATION_WORKER_POLL_MS: ${NOTIFICATION_WORKER_POLL_MS:-2000}
      NOTIFICATION_WORKER_LEASE_MS: ${NOTIFICATION_WORKER_LEASE_MS:-30000}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
    depends_on: { migrate: { condition: service_completed_successfully } }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_BASE: /api/v1 }
    container_name: followa-web
    restart: unless-stopped
    working_dir: /app/apps/web
    environment: { NODE_ENV: production, API_PROXY_URL: http://api:3001 }
    depends_on: [api]
  caddy:
    image: caddy:2-alpine
    container_name: followa-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { WEB_DOMAIN: ${WEB_DOMAIN:-:80}, API_DOMAIN: ${API_DOMAIN:-:80} }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", caddy_data:/data, caddy_config:/config]
    depends_on: [web, api]
volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
