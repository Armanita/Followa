name: followa_mobile
description: فالوآ — سیستم پیگیری و گردش کار داخلی شرکت
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.1.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  shamsi_date: ^1.0.4
  file_picker: 12.1.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: Estedad
      fonts:
        - asset: assets/fonts/Estedad-Light.ttf
          weight: 300
        - asset: assets/fonts/Estedad-Regular.ttf
          weight: 400
        - asset: assets/fonts/Estedad-Medium.ttf
          weight: 500
        - asset: assets/fonts/Estedad-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Estedad-Bold.ttf
          weight: 700
        - asset: assets/fonts/Estedad-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Estedad-Black.ttf
          weight: 900
